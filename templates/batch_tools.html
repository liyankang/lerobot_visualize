<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>批量数据裁剪 - LeRobot 工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f6f8; color: #263238; min-height: 100vh;
        }
        header {
            height: 52px; background: #17202a; color: #eef3f7;
            display: flex; align-items: center; gap: 16px; padding: 0 22px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.22);
        }
        header a { color: #b8c4ce; text-decoration: none; font-size: 13px; }
        header a:hover { color: #fff; }
        header h1 { font-size: 16px; font-weight: 650; }
        main {
            max-width: 1180px; margin: 0 auto; padding: 22px;
            display: grid; grid-template-columns: 420px 1fr; gap: 18px;
        }
        section {
            background: #fff; border: 1px solid #e2e7ec; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(20,40,60,0.05);
        }
        .form { padding: 18px; }
        .form h2, .result h2 { font-size: 15px; margin-bottom: 14px; }
        .group { border-top: 1px solid #edf1f4; padding-top: 14px; margin-top: 14px; }
        .group:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
        label { display: block; font-size: 12px; font-weight: 650; color: #52616d; margin-bottom: 6px; }
        input[type="text"], input[type="number"], select {
            width: 100%; height: 34px; padding: 7px 10px; border: 1px solid #cfd8df;
            border-radius: 6px; font-size: 13px; color: #263238; background: #fff;
        }
        input:focus, select:focus { outline: none; border-color: #1f7aec; box-shadow: 0 0 0 2px rgba(31,122,236,0.12); }
        .field { margin-bottom: 12px; }
        .path-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .check {
            display: flex; align-items: center; gap: 8px; margin: 4px 0 12px;
            font-size: 13px; color: #37474f;
        }
        .check input { width: 16px; height: 16px; }
        .actions { display: flex; gap: 10px; margin-top: 16px; }
        button {
            height: 34px; padding: 0 14px; border: 0; border-radius: 6px;
            font-size: 13px; font-weight: 650; cursor: pointer;
        }
        .primary { background: #1f7aec; color: #fff; }
        .secondary { background: #e8edf2; color: #263238; }
        button:disabled { opacity: 0.55; cursor: not-allowed; }
        .result { padding: 18px; min-height: 540px; }
        .summary {
            display: grid; grid-template-columns: 1.25fr 1.25fr 1fr; gap: 12px; margin-bottom: 16px;
        }
        .summary-card {
            border: 1px solid #e2e7ec; border-radius: 8px; padding: 12px; background: #fafbfc;
            min-width: 0;
        }
        .summary-card h3 {
            font-size: 12px; color: #52616d; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 0.4px;
        }
        .summary-pair {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
        }
        .summary-item {
            min-width: 0; padding: 8px; border-radius: 6px; background: #fff;
            border: 1px solid #edf1f4;
        }
        .summary-item .num {
            font-size: 22px; line-height: 1.1; font-weight: 800; color: #17202a;
            white-space: nowrap;
        }
        .summary-item .label { font-size: 12px; color: #60717f; margin-top: 5px; }
        .summary-item.primary .num { color: #1f7aec; }
        .summary-item.warn .num { color: #b42318; }
        .summary-item.ok .num { color: #067647; }
        .iqr-range {
            font-size: 24px; line-height: 1.1; font-weight: 800; color: #17202a;
            white-space: nowrap;
        }
        .iqr-sub { font-size: 12px; color: #60717f; margin-top: 8px; line-height: 1.5; }
        .episode-preview { margin-top: 16px; }
        .episode-toolbar {
            display: grid; grid-template-columns: 220px 1fr; gap: 12px;
            align-items: end; margin-bottom: 12px;
        }
        .episode-info {
            display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr));
            gap: 8px; margin-bottom: 12px;
        }
        .info-chip {
            border: 1px solid #e2e7ec; border-radius: 7px; padding: 8px;
            background: #fafbfc; font-size: 12px; color: #52616d;
        }
        .info-chip b { display: block; color: #263238; font-size: 14px; margin-bottom: 2px; }
        .curve-card {
            border: 1px solid #e2e7ec; border-radius: 8px; background: #fff;
            padding: 10px;
        }
        .curve-head {
            display: flex; justify-content: space-between; gap: 10px;
            font-size: 12px; color: #52616d; margin-bottom: 8px;
        }
        .curve-head b { color: #263238; }
        .curve-svg {
            width: 100%; height: 170px; display: block; background: #fbfcfd;
            border: 1px solid #edf1f4; border-radius: 6px;
        }
        .curve-legend {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
            font-size: 11px; color: #52616d;
        }
        .legend-dot {
            width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 4px;
        }
        .empty { color: #78909c; font-size: 13px; padding: 18px 0; }
        .status {
            margin-top: 14px; padding: 10px 12px; border-radius: 6px;
            background: #eef6ff; color: #145ea8; font-size: 13px; display: none;
            white-space: pre-line;
        }
        .status.error { background: #fff1f0; color: #b42318; }
        .status.ok { background: #ecfdf3; color: #067647; }
        .progress-box {
            display: none; margin-top: 14px; border: 1px solid #d9e3ec;
            border-radius: 8px; background: #fafcff; padding: 12px;
        }
        .progress-title { font-size: 13px; font-weight: 700; color: #263238; }
        .progress-detail { font-size: 12px; color: #60717f; margin-top: 4px; min-height: 18px; }
        .progress-track {
            margin-top: 10px; height: 10px; border-radius: 999px;
            background: #e7edf3; overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0%; background: #1f7aec; transition: width 0.2s ease;
        }
        .progress-meta { font-size: 11px; color: #60717f; margin-top: 6px; text-align: right; }
        .modal-backdrop {
            display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.46);
            z-index: 1000; align-items: center; justify-content: center; padding: 18px;
        }
        .modal-backdrop.active { display: flex; }
        .modal {
            width: min(760px, 96vw); max-height: 86vh; background: #fff;
            border-radius: 8px; border: 1px solid #d9e3ec; padding: 16px;
            display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(0,0,0,0.22);
        }
        .modal h3 { font-size: 15px; margin-bottom: 10px; }
        .current {
            font-family: Consolas, monospace; font-size: 12px; color: #52616d;
            background: #f6f8fa; border: 1px solid #e2e7ec; border-radius: 6px;
            padding: 8px; margin-bottom: 10px; word-break: break-all;
        }
        .dir-list {
            min-height: 220px; max-height: 430px; overflow: auto; border: 1px solid #e2e7ec;
            border-radius: 6px; background: #fbfcfd; padding: 6px;
        }
        .dir-item {
            padding: 8px 10px; border-radius: 5px; cursor: pointer; font-size: 13px;
        }
        .dir-item:hover { background: #eaf2ff; }
        .dir-item.parent { color: #1f7aec; font-weight: 650; }
        @media (max-width: 940px) {
            main { grid-template-columns: 1fr; padding: 14px; }
            .summary { grid-template-columns: 1fr; }
            .episode-toolbar { grid-template-columns: 1fr; }
            .episode-info { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header>
        <a href="/">← 工具箱</a>
        <h1>批量数据裁剪</h1>
    </header>

    <main>
        <section class="form">
            <h2>批处理设置</h2>
            <div class="group">
                <div class="field">
                    <label for="input-path">输入数据集路径</label>
                    <div class="path-row">
                        <input id="input-path" type="text" placeholder="D:\path\dataset">
                        <button class="secondary" id="input-browse" type="button">浏览</button>
                    </div>
                </div>
                <div class="field">
                    <label for="output-path">输出数据集路径</label>
                    <div class="path-row">
                        <input id="output-path" type="text" placeholder="D:\path\dataset_filtered">
                        <button class="secondary" id="output-browse" type="button">浏览</button>
                    </div>
                </div>
            </div>

            <div class="group">
                <label class="check">
                    <input id="auto-length-iqr" type="checkbox" checked>
                    用 IQR 自动删除过短和过长 episode
                </label>
                <div class="field">
                    <label for="iqr-multiplier">IQR 倍数</label>
                    <input id="iqr-multiplier" type="number" min="0" step="0.1" value="1.5">
                </div>
            </div>

            <div class="group">
                <label class="check">
                    <input id="trim-static" type="checkbox">
                    裁掉开头和结尾静止帧
                </label>
                <div class="split">
                    <div class="field">
                        <label for="motion-threshold">静止阈值</label>
                        <input id="motion-threshold" type="number" step="0.00001" value="0.0001">
                    </div>
                    <div class="field">
                        <label for="motion-metric">运动量</label>
                        <select id="motion-metric">
                            <option value="max_abs">max_abs</option>
                            <option value="norm">norm</option>
                        </select>
                    </div>
                </div>
                <div class="split">
                    <div class="field">
                        <label for="margin-frames">边界额外保留帧</label>
                        <input id="margin-frames" type="number" min="0" value="0">
                    </div>
                    <div class="field">
                        <label for="min-static-frames">最小静止段帧数</label>
                        <input id="min-static-frames" type="number" min="1" value="1">
                    </div>
                </div>
                <div class="field">
                    <label for="joint-indices">只用指定 state 维度判断静止</label>
                    <input id="joint-indices" type="text" placeholder="例如 0,1,2；留空使用全部维度">
                </div>
                <label class="check">
                    <input id="allow-empty" type="checkbox">
                    允许输出 0 个 episode
                </label>
                <label class="check">
                    <input id="skip-video-stats" type="checkbox">
                    保存时跳过视频统计，仍计算 state/action
                </label>
            </div>

            <div class="actions">
                <button class="secondary" id="preview-btn">预览</button>
                <button class="primary" id="run-btn">执行并保存</button>
            </div>
            <div id="status" class="status"></div>
            <div id="progress-box" class="progress-box">
                <div class="progress-title" id="progress-title">准备中</div>
                <div class="progress-detail" id="progress-detail"></div>
                <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
                <div class="progress-meta" id="progress-meta">0%</div>
            </div>
        </section>

        <section class="result">
            <h2>预览结果</h2>
            <div id="summary" class="summary"></div>
            <div class="episode-preview">
                <div class="episode-toolbar">
                    <div class="field">
                        <label for="episode-select">选择可视化 episode</label>
                        <select id="episode-select" disabled>
                            <option value="">尚未预览</option>
                        </select>
                    </div>
                    <div class="empty" id="affected-note">尚未预览</div>
                </div>
                <div id="episode-info" class="episode-info"></div>
                <div id="curve-panel">
                    <div class="empty">尚未预览</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal-backdrop" id="browse-modal">
        <div class="modal">
            <h3 id="browse-title">选择目录</h3>
            <div class="current" id="browse-current">/</div>
            <div class="field">
                <input type="text" id="browse-input" placeholder="输入路径后按回车跳转">
            </div>
            <div class="dir-list" id="browse-list"></div>
            <div class="actions">
                <button class="secondary" id="browse-cancel" type="button">取消</button>
                <button class="primary" id="browse-ok" type="button">选择此目录</button>
            </div>
        </div>
    </div>

    <script src="/static/batch_tools.js"></script>
</body>
</html>
